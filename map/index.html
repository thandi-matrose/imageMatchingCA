<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>syCAMOR Presentation</title>
  <!-- KaTeX CSS for equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
    integrity="sha384-GvrOXuhMATgEsMd3s6E5Tocmz2+U81hIom+1vJ8o+U6f34Q8rL6G1hO5x1O9g6+K" crossorigin="anonymous">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
<svg class="liquid-glass-filters" aria-hidden="true">
  <defs>
    <filter id="glass-refraction">
      <!-- 1. Generate organic, fluid-like distortion waves -->
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />

      <!-- 2. Soften the noise waves to mimic thick, smooth glass edges -->
      <feGaussianBlur in="noise" stdDeviation="8" result="blurredNoise" />

      <!-- 3. Displace the background pixels based on the red and green color channels of the noise -->
      <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="25" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>
</html>
<script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>

</html>
