name: Deploy React Vite App

on:
  push:
    branches:
      - main # change to master if your default branch is master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Highlight-Start
    env:
      CI: false
    # Highlight-End
    runs-on: ubuntu-latest
    defaults:
      run:
        # Crucial step: tells GitHub Actions to execute commands inside your app directory
        working-directory: ./map
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './map/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
            CI: false
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Points to the build output directory inside your sub-folder
          path: './map/dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
